    - Name: BenMo_Motor1
      DeviceType: BenMo_Custom_Motor
      Id: 4 #上报can_id -  Rec_Id_Offest 实际的id为3
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
