  bm_m1502d_Motor_4_custom_device_config: &bm_m1502d_Motor_4_custom_device_config
    <<: *BM_M1502D_Motor4_config
  bm_m1502d_Motor_5_custom_device_config: &bm_m1502d_Motor_5_custom_device_config
    <<: *BM_M1502D_Motor5_config
  bm_m1502d_Motor_6_custom_device_config: &bm_m1502d_Motor_6_custom_device_config
    <<: *BM_M1502D_Motor6_config
  bm_m1502d_Motor_7_custom_device_config: &bm_m1502d_Motor_7_custom_device_config
