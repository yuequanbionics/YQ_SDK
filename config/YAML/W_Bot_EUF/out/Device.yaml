      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]
      - [  0,   0,  125]

  Led_Belt_Shoulder_Config: &Led_Belt_Shoulder_Config
    - Name: Led_GoGo
      DeviceType: Led_Device
      Id: 301
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      Detect: false
      DeviceConfig:
        <<: *Led_Device_Shoulder_Config

  Led_Belt_Chassis_Config: &Led_Belt_Chassis_Config
    - Name: Led_Chassis_GoGo
      DeviceType: Led_Device
      Id: 302
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      Detect: false
      DeviceConfig:
        <<: *Led_Device_Chassis_Config

Base_Node: 
  - Name: Main_Switch_Board
    Range_Name: W_Bot
    DeviceType: Switch_Board 
    Id: 101
    Rec_Id_Offest: [1408, 1024]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.101
    Port: 15101
    Up_Data_Speed: 10000
    # Save_Config: *Save_Main_Config

    DeviceConfig:
      PrintMcuTaskStack: true
      Serial_S:
        - Serial_CH: USART1
          Serial_menu: 1
          Serial_Baud: 115200
          <<: *Serial_General_Config
          Stm_Tx_Rx_GPIO:
            Tx_GPIO: GPIOA
            Rx_GPIO: GPIOA
            Tx_GPIO_PIN: GPIO_PIN_9
            Rx_GPIO_PIN: GPIO_PIN_10
          Other_Config:
            <<: *Serial_1_DMA_Config

      Timer_S:  *Timer_WS2812B_Config
      Can_S: 
        - Can_Instance: 1
          <<: *FD_Can_1M_5M
        - Can_Instance: 2
          <<: *FD_Can_1M_5M

    child:
      --: *Phu_Motor_Yaw
      --: *Rhu_Motor_Left_Arm
      --: *Rhu_Motor_Right_Arm
      --: *Led_Belt_Shoulder_Config
      --: *Tape_Tho_IMU_Device


  - Name: Waist_Main_Switch_Board
    Range_Name: W_Bot
    DeviceType: Switch_Board 
    Id: 102
    Rec_Id_Offest: [1408, 1024]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.102
    Port: 15102
    Up_Data_Speed: 2000
    DeviceConfig:
      Can_S: 
        - Can_Instance: 2
          <<: *FD_Can_1M_5M

    child:
      --: *Phu_Motor_Roll
      --: *Phu_Motor_Hip
      --: *Phu_Motor_Knee
      --: *Phu_Motor_Ankel
      --: *Battery_BMS_V2_Knee_Device

  - Name: Chassis_Main_Switch_Board
    Range_Name: W_Bot
    DeviceType: Switch_Board 
    Id: 103
    Rec_Id_Offest: [1024, 150]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.103
    Port: 15103
    Up_Data_Speed: 2000
    DeviceConfig:
      PrintMcuTaskStack: true
      Serial_S:
        - Serial_CH: USART1
          Serial_menu: 1
          Serial_Baud: 115200
          Serial_ID: 201
          <<: *Serial_General_Config
          Stm_Tx_Rx_GPIO:
            Tx_GPIO: GPIOA
            Rx_GPIO: GPIOA
            Tx_GPIO_PIN: GPIO_PIN_9
            Rx_GPIO_PIN: GPIO_PIN_10
          Other_Config:
            <<: *Serial_1_DMA_Config

      Timer_S:  *Timer_WS2812B_Config
      Can_S: 
        - Can_Instance: 1
          <<: *Classic_Can_1M
        - Can_Instance: 2
          <<: *Classic_Can_1M

    child:
      --: *Led_Belt_Chassis_Config
      --: *Tape_Cha_IMU_Device
      --: *BenMo_Motor_Chassis_Wheel
      --: *Battery_BMS_V2_Device






