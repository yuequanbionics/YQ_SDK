      CH: Head_Flag_Switch_CH2
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: 
        Motor_Mod: CSP
        <<: *phu20_motor_device_config
  
  #--------------
  # @brief  Eyou电机 腰部
  #--------------
