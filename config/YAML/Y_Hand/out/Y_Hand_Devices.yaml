Base_Node: 
  - Name: Main_Switch_Board
    Range_Name: Motor
    DeviceType: Switch_Board # Motor_Device IMU_Device Key_Device Switch_Board Custom_Device
    Id: 101
    # Rec_Id_Offest: [1536, 1024]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.101
    Port: 15100
    Up_Data_Speed: 10000
    Heart_Beat: true

    DeviceConfig:
      PrintMcuTaskStack: false
      Save_to_Flash: false   # 置 true 表示将 Can 配置写入 flash
      Can_S:
       - Can_Instance: 1
         <<: *FD_Can_2M_4M
       - Can_Instance: 2
         <<: *FD_Can_2M_4M

      Timer_S: 
        - Timer_Index: 1
          Prescaler: 0
          CounterMode: TIM_COUNTERMODE_UP
          Period: 311
          <<: *Tim17_Head_Config
          Tim_CHX:
            Timer_ChX: 1
            Timer_ChX_OutMode: DMA
            <<: *Tim_Ch1_Config
            DMA_Config:
              Timer_Ch_DMA_Instance: DMA2_Stream0
              <<: *Tim_Ch_DMA1_Config

    child:
      --: *Led_Belt_Config
      --: *Auto_Set_Id_DeviceS0
      --: *MotorS_0
      

      --: *Auto_Set_Id_DeviceS1
      --: *MotorS_1


