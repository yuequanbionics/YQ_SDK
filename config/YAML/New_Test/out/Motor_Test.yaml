  Auto_Set_Id_DeviceS: &Auto_Set_Id_DeviceS
    - Name: Auto_Set_Id_0
      DeviceType: Auto_Set_Id 
      Detect: false
      Id: 10
      CH: Head_Flag_Switch_CH2
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

      DeviceConfig:
        Run_Set: *Run_Auto_Set_Id
        Start_Id: 30
        Save_Id: true
        Time_Out_Ms: 1000
        DeviceList:
          --: *MotorS_0
          --: *MotorS_1
  
  Auto_Set_Id_Cat: &Auto_Set_Id_Cat
    --: *MotorS_0

Base_Node: 
  - Name: Main_Switch_Board
    Range_Name: Motor
    DeviceType: Switch_Board # Motor_Device IMU_Device Key_Device Switch_Board Custom_Device
    Id: 101
    # Rec_Id_Offest: [1536, 1024]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.101
    Port: 15101
    Up_Data_Speed: 4000
    Heart_Beat: true
    Save_Config: *Save_Main_Config
    IO_Map:
      <<: *IO_Map_Default
      Send: *IO_Map_Send

    DeviceConfig:
      PrintMcuTaskStack: false

