config:
  BM_M1502D_Motor_Config: &BM_M1502D_Base_Config
    BM_Motor_EN_In_Init: true
    BM_Set_Zero_In_Init: false
    BM_Motor_Zero_Write: false
    BM_Motor_Config: true
    BM_Control_Mode: 3  # 控制模式：1=电流环，2=速度环，3=位置环 (上电需要重新设置)
    BM_Feedback_Mode: 10 # 反馈模式：10=10ms主动上报 (上电需要重新设置)

    BM_Motor_Speed_P_Dividend: 128  # 速度环P被除数
    BM_Motor_Speed_P_Divisor: 6  # 速度环P除数（2^6）
    BM_Motor_Speed_I_Dividend: 1  # 速度环I被除数
    BM_Motor_Speed_I_Divisor: 9  # 速度环I除数

  # 电机1配置
  BM_M1502D_Motor1_config: &BM_M1502D_Motor1_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 1  # 电机ID范围1-8

  # 电机2配置  
  BM_M1502D_Motor2_config: &BM_M1502D_Motor2_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 2

  # 电机3配置
  BM_M1502D_Motor3_config: &BM_M1502D_Motor3_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 3

  # 电机4配置
  BM_M1502D_Motor4_config: &BM_M1502D_Motor4_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 4

  # 电机5配置
  BM_M1502D_Motor5_config: &BM_M1502D_Motor5_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 5

  # 电机6配置
  BM_M1502D_Motor6_config: &BM_M1502D_Motor6_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 6

  # 电机7配置
  BM_M1502D_Motor7_config: &BM_M1502D_Motor7_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 7

  # 电机8配置
  BM_M1502D_Motor8_config: &BM_M1502D_Motor8_config
    <<: *BM_M1502D_Base_Config

    BM_Motor_ID: 8
