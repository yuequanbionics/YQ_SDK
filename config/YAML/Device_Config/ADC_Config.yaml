      ADC_Overrun: ADC_OVR_DATA_OVERWRITTEN
      ADC_LeftBitShift: ADC_LEFTBITSHIFT_NONE
      ADC_OversamplingMode: DISABLE
      ADC_Oversampling.Ratio: 1
