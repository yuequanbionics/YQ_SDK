config:
  cat_motor_device_config: &cat_motor_device_config
    <<: *Usr_Motor_Init_Config
    <<: *Self_10MM_Motor_default_config
    Motor_AB_Mirror: false
    Current_Amplifier_Gain: 1
    DI_I_MAX: 1.0
    Gear_Ratio: 22

  Motor_Config_Normal_0: &Motor_Config_Normal_0
    DeviceType: Motor_Device # Motor_Device IMU_Device Key_Device Switch_Board Custom_Device
    CH: Head_Flag_Switch_CH2
    IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

  MotorS_0: &MotorS_0
    - Name: Motor_1
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        
    - Name: Motor_2
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig:
        <<: *cat_motor_device_config

    - Name: Motor_3
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig:
        <<: *cat_motor_device_config

    - Name: Motor_4
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig:
        <<: *cat_motor_device_config

    - Name: Motor_5
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig:
        <<: *cat_motor_device_config

    - Name: Motor_6
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig:
        <<: *cat_motor_device_config


  Auto_Set_Id_DeviceS0: &Auto_Set_Id_DeviceS0
    - Name: Auto_Set_Id_0
      DeviceType: Auto_Set_Id 
      Detect: false
      Id: 1
      CH: Head_Flag_Switch_CH2
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

      DeviceConfig:
        Run_Set: *Run_Auto_Set_Id
        Start_Id: 11
        Save_Id: *Auto_Set_Id_Save
        Time_Out_Ms: 1000
        DeviceList:
          --: *MotorS_0


Base_Node: 
  - Name: Main_Switch_Board
    Range_Name: Motor
    DeviceType: Switch_Board # Motor_Device IMU_Device Key_Device Switch_Board Custom_Device
    Id: 101
    # Rec_Id_Offest: [1536, 1024]
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.101
    Port: 15100
    Up_Data_Speed: 10000
    Heart_Beat: true

    DeviceConfig:
      PrintMcuTaskStack: false
      Save_to_Flash: false   # 置 true 表示将 Can 配置写入 flash
      Can_S:
       - Can_Instance: 1
         <<: *FD_Can_2M_4M
       - Can_Instance: 2
         <<: *FD_Can_2M_4M

    child:
      # --: *Led_Belt_Config
      --: *Auto_Set_Id_DeviceS0
      --: *MotorS_0
